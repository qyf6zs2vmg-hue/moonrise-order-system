<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store | Invites & Admin</title>
  <style>
    /* -------------------------------------------------------------
       CSS RESET & VARIABLES
       ------------------------------------------------------------- */
    :root {
      --bg: #f8fafc;
      --surface: rgba(255, 255, 255, 0.85);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --success: #059669;
      --success-hover: #047857;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --border: #e2e8f0;
      --radius: 20px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      --font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%; height: 100%;
      font-family: var(--font);
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, #f0f9ff 0%, transparent 50%),
        radial-gradient(at 100% 0%, #fef2f2 0%, transparent 50%),
        radial-gradient(at 100% 100%, #f0fdf4 0%, transparent 50%),
        radial-gradient(at 0% 100%, #fff7ed 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* -------------------------------------------------------------
       SCREENS
       ------------------------------------------------------------- */
    .screen {
      display: none;
      width: 100%; height: 100%;
      overflow-y: auto;
    }
    .screen.active {
      display: flex;
      flex-direction: column;
    }

    /* -------------------------------------------------------------
       COMMON COMPONENTS
       ------------------------------------------------------------- */
    .card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .btn-sm { padding: 8px 12px; font-size: 0.875rem; border-radius: 8px; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: var(--success-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
    .btn-outline:hover { background: rgba(0,0,0,0.05); }

    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; }
    .input-group input {
      width: 100%; padding: 12px 16px;
      border-radius: 12px; border: 1px solid var(--border);
      font-size: 1rem; transition: all 0.2s;
      background: white;
    }
    .input-group input:focus { outline: none; border-color: var(--primary); }

    .header-layout {
      width: 100%; max-width: 1200px;
      margin: 0 auto; padding: 24px 32px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-layout h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }

    /* -------------------------------------------------------------
       AUTH SCREEN
       ------------------------------------------------------------- */
    #auth-screen { align-items: center; justify-content: center; padding: 24px; }
    .auth-box { width: 100%; max-width: 400px; text-align: center; }

    /* -------------------------------------------------------------
       ADMIN SCREEN
       ------------------------------------------------------------- */
    .admin-container { max-width: 1000px; width: 100%; margin: 0 auto; padding: 0 32px 40px; }
    
    .tabs { display: flex; gap: 12px; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
    .tab-btn {
      background: transparent; border: none; padding: 12px 20px;
      font-size: 1rem; font-weight: 600; color: var(--text-muted); cursor: pointer;
      position: relative; top: 2px;
    }
    .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
    
    .tab-pane { display: none; }

    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px; border-bottom: 1px solid var(--border);
    }
    .list-item:last-child { border-bottom: none; }
    .item-info { font-size: 0.9375rem; }
    .item-actions { display: flex; gap: 8px; }
    .badge {
      display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
      background: #e2e8f0; color: #475569;
    }
    .badge.success { background: #dcfce7; color: #166534; }
    .badge.warning { background: #fef08a; color: #854d0e; }

    /* -------------------------------------------------------------
       CLIENT / STORE SCREEN
       ------------------------------------------------------------- */
    .shop-container {
      display: flex; flex-direction: column; gap: 32px;
      max-width: 1200px; width: 100%; margin: 0 auto; padding: 0 32px 40px;
    }
    @media (min-width: 768px) { .shop-container { flex-direction: row; align-items: flex-start; } }

    .products-grid { flex: 1; overflow-x: auto; }
    
    .erp-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .erp-table th, .erp-table td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9375rem;
    }
    .erp-table th {
      background: #f8fafc;
      font-weight: 600;
      color: var(--text-main);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
    .erp-table tr:last-child td {
      border-bottom: none;
    }
    .erp-table tbody tr:hover {
      background: #f1f5f9;
    }

    .cart-panel { position: sticky; top: 24px; width: 100%; }
    @media (min-width: 768px) { .cart-panel { width: 360px; flex-shrink: 0; } }
    
    .cart-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.25rem; margin-bottom: 20px; }
    .cart-items { max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: white;
      font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .cart-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.25rem; padding-top: 20px; border-top: 2px dashed var(--border); margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- ================= AUTH SCREEN ================= -->
  <div id="auth-screen" class="screen">
    <div class="card auth-box">
      <h2 style="margin-bottom: 8px;">Вход в систему</h2>
      <div id="auth-tabs" style="display: flex; gap: 8px; margin-bottom: 16px; justify-content: center;">
        <button class="btn btn-sm active switch-auth-tab-btn" data-tab="login" style="flex:1;" id="tab-login">Вход</button>
        <button class="btn btn-sm btn-outline switch-auth-tab-btn" data-tab="register" style="flex:1;" id="tab-register">Регистрация</button>
      </div>
      
      <!-- Login Form -->
      <div id="login-form-container">
        <form id="login-form" onsubmit="window.handleLogin(event)">
          <div class="input-group">
            <label>Email</label>
            <input type="email" id="auth-login-email" required placeholder="user@example.com">
          </div>
          <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="auth-login-password" required placeholder="******">
          </div>
          <button type="submit" class="btn" style="width: 100%;">Войти</button>
        </form>
      </div>

      <!-- Register Form -->
      <div id="register-form-container" style="display: none;">
        <form id="register-form">
          <div class="input-group">
            <label>Инвайт код</label>
            <input type="text" id="auth-reg-invite" required placeholder="A7fK29xZ">
          </div>
          <div class="input-group">
            <label>Ваше Имя</label>
            <input type="text" id="auth-reg-name" required placeholder="John Doe">
          </div>
          <div class="input-group">
            <label>Email</label>
            <input type="email" id="auth-reg-email" required placeholder="user@example.com">
          </div>
          <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="auth-reg-password" required placeholder="******">
          </div>
          <button type="button" class="btn btn-success" style="width: 100%;" onclick="window.submitRequest()">Зарегистрироваться</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= ADMIN SCREEN ================= -->
  <div id="admin-screen" class="screen">
    <header class="header-layout">
      <h1>Admin Panel</h1>
      <button class="btn btn-outline btn-sm logout-btn">Выйти</button>
    </header>

    <div class="admin-container">
      <div class="tabs">
        <button class="tab-btn active switch-admin-tab-btn" id="tab-btn-codes" data-tab="codes">Codes</button>
        <button class="tab-btn switch-admin-tab-btn" id="tab-btn-requests" data-tab="requests">Requests</button>
        <button class="tab-btn switch-admin-tab-btn" id="tab-btn-users" data-tab="users">Users</button>
      </div>

      <div class="card">
        <!-- Codes Pane -->
        <div id="pane-codes" class="tab-pane" style="display: block;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-size: 1.25rem;">Инвайт коды</h2>
            <button class="btn btn-sm create-invite-btn">Create Invite</button>
          </div>
          <div id="invites-list" style="display: flex; flex-direction: column;"></div>
        </div>

        <!-- Requests Pane -->
        <div id="pane-requests" class="tab-pane">
          <h2 style="font-size: 1.25rem; margin-bottom: 20px;">Заявки на регистрацию</h2>
          <div id="requests-list" style="display: flex; flex-direction: column;"></div>
        </div>

        <!-- Users Pane -->
        <div id="pane-users" class="tab-pane">
          <h2 style="font-size: 1.25rem; margin-bottom: 20px;">Зарегистрированные пользователи</h2>
          <div id="users-list" style="display: flex; flex-direction: column;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= CLIENT SCREEN ================= -->
  <div id="client-screen" class="screen">
    <header class="header-layout" style="padding-bottom: 0;">
      <h1>Store.</h1>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span id="client-name" style="font-weight: 600; color: var(--text-muted);"></span>
        <button class="btn btn-outline btn-sm logout-btn">Выйти</button>
      </div>
    </header>

    <div class="client-tabs-container" style="max-width: 1200px; margin: 0 auto; padding: 24px 32px;">
      <div class="tabs">
        <button class="tab-btn active switch-client-tab-btn" id="c-btn-shop" data-tab="shop">Магазин</button>
        <button class="tab-btn switch-client-tab-btn" id="c-btn-active" data-tab="active">Активные заказы</button>
        <button class="tab-btn switch-client-tab-btn" id="c-btn-archive" data-tab="archive">Архив заказов</button>
      </div>
    </div>

    <!-- Shop Pane -->
    <div id="c-pane-shop" class="tab-pane" style="display: block;">
      <div class="shop-container">
        <!-- Products Table -->
        <div class="products-grid" id="products-grid"></div>

        <!-- Cart -->
        <div class="card cart-panel">
          <div class="cart-header">
            <span>Корзина</span>
          </div>
          <div class="cart-items" id="cart-items"></div>
          <div class="cart-total">
            <span>Итого:</span>
            <span id="cart-total-price">$0</span>
          </div>
          <button class="btn place-order-btn" style="width: 100%;">Оформить Заказ</button>
        </div>
      </div>
    </div>

    <!-- Active Orders Pane -->
    <div id="c-pane-active" class="tab-pane">
      <div class="card" style="max-width: 1000px; margin: 0 auto;">
        <h2 style="font-size: 1.25rem; margin-bottom: 20px;">Мои активные заказы</h2>
        <div id="client-active-list" style="display: flex; flex-direction: column;"></div>
      </div>
    </div>

    <!-- Archive Orders Pane -->
    <div id="c-pane-archive" class="tab-pane">
      <div class="card" style="max-width: 1000px; margin: 0 auto;">
        <h2 style="font-size: 1.25rem; margin-bottom: 20px;">Архив заказов</h2>
        <div id="client-archive-list" style="display: flex; flex-direction: column;"></div>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script type="module">
    import { db, auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, collection, doc, setDoc, addDoc, where, getDocs, getDoc, updateDoc, deleteDoc, onSnapshot, query, writeBatch } from './src/firebase.js';

    // Firebase Auth session management
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        state.currentUser = { uid: user.uid, email: user.email };
        await setupRealtimeSync();
      } else {
        state.currentUser = null;
        if (typeof initApp === 'function') initApp();
      }
    });

    let unsubscribes = [];
    async function setupRealtimeSync() {
      unsubscribes.forEach(u => u());
      unsubscribes = [];

      if (state.currentUser && state.currentUser.role === 'admin' && !state.currentUser.uid) {
        // Admin bypass mode
        unsubscribes.push(onSnapshot(collection(db, 'invites'), snap => {
          state.inviteCodes = snap.docs.map(d => ({ code: d.id, ...d.data() }));
          state.inviteCodes.sort((a,b) => b.createdAt - a.createdAt);
          const paneCodes = document.getElementById('pane-codes');
          if (paneCodes && paneCodes.style.display === 'block') renderInvites(state.inviteCodes);
        }));
        unsubscribes.push(onSnapshot(collection(db, 'users'), (snapshot) => {
          const users = [];
          snapshot.forEach(doc => {
            users.push({ id: doc.id, ...doc.data() });
          });
          console.log("LOADED USERS:", users);
          
          state.allUsers = users; // save for tabs
          state.requests = users.filter(u => u.status === 'pending');
          state.users = users.filter(u => u.status === 'active');
          
          const paneReqs = document.getElementById('pane-requests');
          const paneUsers = document.getElementById('pane-users');
          if (paneReqs && paneReqs.style.display === 'block') renderRequests(users);
          if (paneUsers && paneUsers.style.display === 'block') renderUsers();
        }));
        initApp();
        return;
      }

      if (!state.currentUser?.uid) return;

      const userRef = doc(db, 'users', state.currentUser.uid);
      
      unsubscribes.push(onSnapshot(userRef, docSnap => {
        if (!docSnap.exists()) {
          state.currentUser = null;
          signOut(auth).then(() => {
            if (typeof initApp === 'function') initApp();
          });
          return;
        }
        
        const userData = docSnap.data();
        if (userData.status === 'blocked') {
          alert("Ваш аккаунт заблокирован.");
          logout();
          return;
        }

        state.currentUser = { ...state.currentUser, ...userData };
        
        if (state.currentUser.role === 'admin') {
          unsubscribes.push(onSnapshot(collection(db, 'invites'), snap => {
            state.inviteCodes = snap.docs.map(d => ({ code: d.id, ...d.data() }));
            state.inviteCodes.sort((a,b) => b.createdAt - a.createdAt);
            const paneCodes = document.getElementById('pane-codes');
            if (paneCodes && paneCodes.style.display === 'block') renderInvites(state.inviteCodes);
          }));

          unsubscribes.push(onSnapshot(collection(db, 'users'), (snapshot) => {
            const users = [];
            snapshot.forEach(doc => {
              users.push({ id: doc.id, ...doc.data() });
            });
            console.log("LOADED USERS:", users);
            
            state.allUsers = users; // save for tabs
            state.requests = users.filter(u => u.status === 'pending');
            state.users = users.filter(u => u.status === 'active');
            
            const paneReqs = document.getElementById('pane-requests');
            const paneUsers = document.getElementById('pane-users');
            if (paneReqs && paneReqs.style.display === 'block') renderRequests(users);
            if (paneUsers && paneUsers.style.display === 'block') renderUsers();
          }));
        } else if (state.currentUser.role === 'client' && state.currentUser.status === 'active') {
          unsubscribes.push(onSnapshot(collection(db, 'orders'), snap => {
            const allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            allOrders.forEach(o => {
              try { o.items = JSON.parse(o.itemsJson || '[]'); } catch(e) { o.items = []; }
            });
            state.orders_active = allOrders.filter(o => o.status === 'active' && o.userId === state.currentUser.uid);
            state.orders_archive = allOrders.filter(o => o.status === 'archived' && o.userId === state.currentUser.uid);
            state.orders_active.sort((a,b) => b.createdAt - a.createdAt);
            state.orders_archive.sort((a,b) => b.createdAt - a.createdAt);
            const paneActive = document.getElementById('c-pane-active');
            const paneArchive = document.getElementById('c-pane-archive');
            if (paneActive && paneActive.style.display === 'block') renderClientOrders('active');
            if (paneArchive && paneArchive.style.display === 'block') renderClientOrders('archive');
          }));
        }
        
        initApp(); // Refresh UI once state changes
      }));
    }

    /**
     * 1. STATE & CONSTANTS
     */
    const ADMIN_CODE = "MoonriseadmiN4321";

    const STORE_PRODUCTS = [
      { id: 1, name: 'Cola', price: 10, stock: 154, icon: '🥤' },
      { id: 2, name: 'Pepsi', price: 12, stock: 89, icon: '🔵' },
      { id: 3, name: 'Fanta', price: 11, stock: 21, icon: '🍊' }
    ];

    let state = {
      currentUser: null,
      users: [],
      inviteCodes: [],
      requests: [],
      cart: [],
      orders_active: [],
      orders_archive: []
    };

    /**
     * 2. LOCAL STORAGE UTILS
     */
    function loadState() {
      const saved = localStorage.getItem('appState_v2');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.cart = parsed.cart || [];
      }
    }

    function saveState() {
      localStorage.setItem('appState_v2', JSON.stringify({ cart: state.cart }));
    }

    /**
     * 3. INIT & ROUTING
     */
    window.initApp = function() {
      loadState();

      if (document.getElementById('auth-screen')) document.getElementById('auth-screen').classList.remove('active');
      if (document.getElementById('admin-screen')) document.getElementById('admin-screen').classList.remove('active');
      if (document.getElementById('client-screen')) document.getElementById('client-screen').classList.remove('active');

      if (!state.currentUser) {
        if (document.getElementById('auth-screen')) document.getElementById('auth-screen').classList.add('active');
        if (typeof window.switchAuthTab === 'function') window.switchAuthTab('login');
      } else if (state.currentUser.role === 'admin') {
        if (document.getElementById('admin-screen')) document.getElementById('admin-screen').classList.add('active');
        window.switchAdminTab('codes');
      } else if (state.currentUser.status === 'pending') {
         if (document.getElementById('auth-screen')) document.getElementById('auth-screen').classList.add('active');
         const tabs = document.getElementById('auth-tabs');
         if(tabs) tabs.style.display = 'none';
         const lform = document.getElementById('login-form-container');
         if(lform) lform.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">Ваша заявка находится на рассмотрении.</p><button class="btn btn-outline logout-btn" style="width: 100%;">Выйти</button>';
         if(lform) lform.style.display = 'block';
         const rform = document.getElementById('register-form-container');
         if(rform) rform.style.display = 'none';
      } else if (state.currentUser.role === 'client') {
        if (document.getElementById('client-screen')) document.getElementById('client-screen').classList.add('active');
        if (document.getElementById('client-name')) document.getElementById('client-name').innerText = state.currentUser.name;
        switchClientTab('shop');
        renderClientShop();
        renderCart();
      }
    };
    const initApp = window.initApp;

    function switchClientTab(tabId) {
      ['shop', 'active', 'archive'].forEach(id => {
        const btn = document.getElementById(`c-btn-${id}`);
        const pane = document.getElementById(`c-pane-${id}`);
        if(btn) btn.classList.remove('active');
        if(pane) pane.style.display = 'none';
      });
      const tbtn = document.getElementById(`c-btn-${tabId}`);
      if(tbtn) tbtn.classList.add('active');
      const tpane = document.getElementById(`c-pane-${tabId}`);
      if(tpane) tpane.style.display = 'block';

      if (tabId === 'active') renderClientOrders('active');
      if (tabId === 'archive') renderClientOrders('archive');
    }

    async function logout() {
      state.currentUser = null;
      saveState();
      try {
        await signOut(auth);
      } catch(e) {}
      initApp();
    }

    /**
     * 4. AUTH & REQUEST LOGIC
     */
    window.switchAuthTab = function(tab) {
      if(document.getElementById('auth-tabs')) {
         document.getElementById('auth-tabs').style.display = 'flex';
      }
      document.getElementById('tab-login').classList.remove('active', 'btn-primary');
      document.getElementById('tab-login').classList.add('btn-outline');
      document.getElementById('tab-register').classList.remove('active', 'btn-primary');
      document.getElementById('tab-register').classList.add('btn-outline');
      
      if(tab === 'login') {
        document.getElementById('login-form-container').style.display = 'block';
        document.getElementById('register-form-container').style.display = 'none';
        document.getElementById('tab-login').classList.add('active', 'btn-primary');
        document.getElementById('tab-login').classList.remove('btn-outline');
      } else {
        document.getElementById('login-form-container').style.display = 'none';
        document.getElementById('register-form-container').style.display = 'block';
        document.getElementById('tab-register').classList.add('active', 'btn-primary');
        document.getElementById('tab-register').classList.remove('btn-outline');
      }
    };

    window.handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-login-email').value.trim();
      const password = document.getElementById('auth-login-password').value;

      // Admin Bypass Feature using predefined code in place of password for email
      if (email === "admin@admin.com" && password === ADMIN_CODE) {
        state.currentUser = { role: "admin" };
        saveState();
        initApp();
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        console.error(error);
        if (error.code === 'auth/operation-not-allowed') {
          alert("Необходимо включить Email/Password Authentication в Firebase Console.");
        } else {
          alert("Ошибка входа: неверный email или пароль.");
        }
      }
    };

    window.submitRequest = async () => {
      console.log("REGISTER CLICKED");
      const inviteCode = document.getElementById('auth-reg-invite').value.trim();
      const name = document.getElementById('auth-reg-name').value.trim();
      const email = document.getElementById('auth-reg-email').value.trim();
      const password = document.getElementById('auth-reg-password').value;
      
      if (!inviteCode || !name || !email || !password) return alert("Заполните все поля");

      // 1. Check invite code
      const q = query(collection(db, 'invites'), where("code", "==", inviteCode));
      const querySnapshot = await getDocs(q);
      if (querySnapshot.empty) return alert("Этот инвайт код не существует.");
      
      const inviteDoc = querySnapshot.docs[0];
      if (inviteDoc.data().used) return alert("Этот инвайт код уже использован.");

      try {
        // 2. Create User
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 3. Save to Firestore
        await addDoc(collection(db, "users"), {
          name,
          email,
          inviteCode,
          role: "client",
          status: "pending",
          createdAt: Date.now(),
          uid: user.uid
        });
        console.log("USER SAVED");

        const batch = writeBatch(db);
        batch.update(inviteDoc.ref, { used: true });
        
        await batch.commit();
        alert("REGISTER WORKS");
        alert("✅ Заявка отправлена успешно! Ожидайте одобрения администратором.");
      } catch (error) {
        console.error(error);
        if (error.code === 'auth/email-already-in-use') {
          alert("Этот Email уже зарегистрирован.");
        } else if (error.code === 'auth/weak-password') {
          alert("Пароль слишком слабый (минимум 6 символов).");
        } else {
          alert(error.message);
        }
      }
    };

    /**
     * 5. ADMIN PANEL LOGIC
     */
    window.switchAdminTab = function(tabId) {
      document.querySelectorAll('#admin-screen .tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-btn-${tabId}`);
      if (activeBtn) activeBtn.classList.add('active');

      document.querySelectorAll('#admin-screen .tab-pane').forEach(p => p.style.display = 'none');
      const activePane = document.getElementById(`pane-${tabId}`);
      if (activePane) activePane.style.display = 'block';

      if (tabId === 'codes') renderInvites(state.inviteCodes);
      if (tabId === 'requests') renderRequests(state.allUsers || []);
      if (tabId === 'users') renderUsers();
    }
    const switchAdminTab = window.switchAdminTab;

    // --- CODES ---
    async function loadInvites() {
      try {
        const querySnapshot = await getDocs(collection(db, "invites"));
        const invites = [];
        querySnapshot.forEach((doc) => {
          invites.push({
            id: doc.id,
            ...doc.data()
          });
        });
        
        console.log("INVITES:", invites);
        state.inviteCodes = invites.sort((a,b) => b.createdAt - a.createdAt);
        renderInvites(state.inviteCodes);
      } catch (error) {
        console.error("Error loading invites:", error);
      }
    }

    async function generateInviteCode() {
      try {
        console.log("FUNCTION STARTED");
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let codeStr = '';
        for (let i = 0; i < 8; i++) {
          codeStr += chars.charAt(Math.floor(Math.random() * chars.length));
        }

        console.log("DB before addDoc:", db);
        await addDoc(collection(db, 'invites'), {
          code: codeStr,
          used: false,
          createdAt: Date.now(),
          createdBy: "admin"
        });
        console.log('INVITE SAVED');
        alert("Invite created successfully");
        loadInvites(); // Reload after creation
      } catch (error) {
        console.error("FIREBASE ERROR:", error);
        alert(error.message);
      }
    }

    function renderInvites(invites) {
      console.log("Rendering invites");
      const container = document.getElementById("invites-list");
      container.innerHTML = "";
      
      if (!invites || invites.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">Нет сгенерированных кодов</div>';
        return;
      }

      invites.forEach(invite => {
        const el = document.createElement("div");
        el.className = "list-item";
        
        const usedHtml = invite.used 
          ? '<span class="badge warning">Использован</span>' 
          : '<span class="badge success">Доступен</span>';

        el.innerHTML = `
          <div class="item-info">
            <strong style="font-family: monospace; font-size: 1.125rem;">${invite.code}</strong>
          </div>
          <div>
            ${usedHtml}
          </div>
        `;
        container.appendChild(el);
      });
    }

    // --- REQUESTS ---
    async function editRequestName(id) {
      console.log('editRequestName click for id:', id);
      const req = state.requests.find(r => r.id === id);
      if (!req) return console.warn('Request not found');
      
      const newName = prompt("Введите новое имя клиента:", req.name);
      if (newName !== null && newName.trim() !== '') {
        await updateDoc(doc(db, 'users', id), { name: newName.trim() });
      }
    }

    async function rejectRequest(id) {
      console.log('rejectRequest click for id:', id);
      if(!confirm("Удалить заявку?")) return;
      await deleteDoc(doc(db, 'users', id));
    }

    async function approveRequest(id) {
      console.log('approveRequest click for id:', id);
      const req = state.requests.find(r => r.id === id);
      if (!req) return console.warn('Request not found');
      
      await updateDoc(doc(db, 'users', id), { status: 'active' });
    }

    function renderRequests(users) {
      console.log("Rendering requests");
      const container = document.getElementById('requests-list');
      container.innerHTML = "";
      
      if (!users || users.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">Нет активных заявок</div>';
        return;
      }

      console.log("USERS FROM FIRESTORE:", users);

      users.forEach(user => {
        const div = document.createElement("div");
        div.className = "list-item";
        div.innerHTML = `
          <div class="item-info">
            <div style="font-weight: 700; margin-bottom: 4px;">${user.name} <span class="badge">${user.email}</span></div>
            <div style="font-size: 0.875rem; color: var(--text-muted);">Код: <span style="font-family: monospace;">${user.inviteCode}</span></div>
          </div>
          <div class="item-actions">
            <button class="btn btn-sm btn-outline edit-req-btn" data-id="${user.id}">✏️ Изменить имя</button>
            <button class="btn btn-sm btn-success approve-req-btn" data-id="${user.id}">✔ Принять</button>
            <button class="btn btn-sm btn-danger reject-req-btn" data-id="${user.id}">❌ Отклонить</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // --- USERS ---
    async function removeUser(id) {
      console.log('removeUser click for id:', id);
      if(!confirm("Вы уверены, что хотите выгнать этого пользователя?")) return;
      
      await updateDoc(doc(db, 'users', id), { status: 'blocked' });
      
      if (state.currentUser && state.currentUser.uid === id) {
        logout();
      }
    }

    function renderUsers() {
      const container = document.getElementById('users-list');
      if (state.users.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">Нет зарегистрированных клиентов</div>';
        return;
      }

      container.innerHTML = state.users.map(u => `
        <div class="list-item">
          <div class="item-info">
            <div style="font-weight: 700; margin-bottom: 4px;">${u.name}</div>
            <div style="font-size: 0.875rem; color: var(--text-muted);">
              Email: ${u.email} &nbsp;|&nbsp; Code: <span style="font-family: monospace;">${u.inviteCode}</span>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn btn-sm btn-danger ban-user-btn" data-id="${u.id}">Выгнать</button>
          </div>
        </div>
      `).join('');
    }

    /**
     * 6. CLIENT SHOP LOGIC
     */
    function renderClientShop() {
      const grid = document.getElementById('products-grid');
      
      let html = `
        <table class="erp-table">
          <thead>
            <tr>
              <th>Название</th>
              <th>Цена</th>
              <th>Остаток</th>
              <th style="width: 100px;">Действие</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      html += STORE_PRODUCTS.map(p => `
        <tr>
          <td>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 1.25rem;">${p.icon}</span>
              <span style="font-weight: 600;">${p.name}</span>
            </div>
          </td>
          <td style="font-weight: 600; color: var(--text-muted);">$${p.price}</td>
          <td>${p.stock}</td>
          <td>
            <button class="btn btn-sm btn-outline add-to-cart-btn" style="width: 100%; white-space: nowrap;" data-id="${p.id}">Добавить</button>
          </td>
        </tr>
      `).join('');
      
      html += `
          </tbody>
        </table>
      `;
      grid.innerHTML = html;
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total-price');
      
      let total = 0;

      if(state.cart.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Пусто</div>';
        totalEl.innerText = '$0';
        return;
      }

      container.innerHTML = state.cart.map(item => {
        total += item.price * item.quantity;
        return `
          <div class="cart-item">
            <div>
              <div style="font-weight: 700; font-size: 0.9375rem;">${item.name}</div>
              <div style="font-size: 0.875rem; color: var(--text-muted);">$${item.price} &times; ${item.quantity} </div>
            </div>
            <div class="qty-controls">
               <button class="qty-btn qty-minus-btn" data-id="${item.id}">-</button>
               <span style="font-weight: 700; min-width: 20px; text-align: center;">${item.quantity}</span>
               <button class="qty-btn qty-plus-btn" data-id="${item.id}">+</button>
            </div>
          </div>
        `;
      }).join('');
      
      totalEl.innerText = `$${total}`;
    }

    function addToCart(id) {
      const product = STORE_PRODUCTS.find(p => p.id === id);
      if(!product) return;
      
      const existing = state.cart.find(item => item.id === id);
      if (existing) {
        existing.quantity++;
      } else {
        state.cart.push({ ...product, quantity: 1 });
      }
      saveState();
      renderCart();
    }

    function changeQty(id, delta) {
      const item = state.cart.find(i => i.id === id);
      if(!item) return;
      
      item.quantity += delta;
      if (item.quantity <= 0) {
        state.cart = state.cart.filter(i => i.id !== id);
      }
      saveState();
      renderCart();
    }

    async function placeOrder() {
      if (state.cart.length === 0) return alert("Корзина пуста");
      
      const total = state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const orderData = {
        customerName: state.currentUser.name,
        customerEmail: state.currentUser.email,
        customerInvite: state.currentUser.inviteCode,
        itemsJson: JSON.stringify(state.cart),
        total: total,
        status: 'active',
        createdAt: Date.now()
      };

      const newOrderRef = doc(collection(db, 'orders'));
      await setDoc(newOrderRef, orderData);
      
      state.cart = [];
      saveState();
      renderCart();
      switchClientTab('active');
      alert("✅ Ваш заказ успешно оформлен! Вы перенаправлены в 'Активные заказы'");
    }

    function renderClientOrders(type) {
      const containerId = type === 'active' ? 'client-active-list' : 'client-archive-list';
      const container = document.getElementById(containerId);
      const sourceArray = type === 'active' ? state.orders_active : state.orders_archive;
      
      // Filter logic deleted since arrays are already scoped to the inviteCode in setupRealtimeSync
      const filtered = sourceArray;

      if (filtered.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">Нет заказов</div>';
        return;
      }

      container.innerHTML = filtered.map(o => `
        <div class="list-item" style="display: block; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; padding: 16px;">
          <div style="display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding-bottom: 12px; margin-bottom: 12px;">
            <div style="font-weight: 700; font-size: 1.125rem;">Заказ #${o.id}</div>
            <div style="font-weight: 800; color: var(--success);">$${o.total}</div>
          </div>
          <div style="margin-bottom: 12px; font-size: 0.9375rem;">
            <strong>Имя:</strong> ${o.customerName} <br>
            <strong>Email:</strong> ${o.customerEmail}
          </div>
          <div style="margin-bottom: 16px; font-size: 0.875rem; background: #f8fafc; padding: 12px; border-radius: 8px;">
            ${o.items.map(item => `
              <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                <span>${item.name} x${item.quantity}</span>
                <span style="font-weight: 600;">$${item.price * item.quantity}</span>
              </div>
            `).join('')}
          </div>
          ${type === 'active' ? `
            <div style="text-align: right;">
              <button class="btn btn-sm btn-success mark-obj-btn" data-id="${o.id}">Получил</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    async function markOrderReceived(id) {
      console.log('markOrderReceived click for id:', id);
      if(!confirm("Пометить заказ как 'Получил' и перенести в архив?")) return;
      
      await updateDoc(doc(db, 'orders', id), { status: 'archived' });
    }

    // Explicitly attach all UI handlers to the window object 
    // to prevent ReferenceError due to bundler scoped variables
    window.logout = logout;
    window.switchAdminTab = switchAdminTab;
    window.switchClientTab = switchClientTab;
    window.generateInviteCode = generateInviteCode;
    window.editRequestName = editRequestName;
    window.rejectRequest = rejectRequest;
    window.approveRequest = approveRequest;
    window.removeUser = removeUser;
    window.addToCart = addToCart;
    window.changeQty = changeQty;
    window.placeOrder = placeOrder;
    window.markOrderReceived = markOrderReceived;

    // Initialize App strictly after DOM loads
    document.addEventListener("DOMContentLoaded", () => {
      initApp();
      loadInvites();
    });

    // Global Click Handler for dynamically created buttons
    document.addEventListener("click", function(e) {

  const createInviteBtn = e.target.closest(".create-invite-btn");
  if (createInviteBtn) {
    console.log("STEP 1: CLICK DETECTED");
    generateInviteCode();
    return;
  }

  const switchAuthTabBtn = e.target.closest(".switch-auth-tab-btn");
  if (switchAuthTabBtn) {
    switchAuthTab(switchAuthTabBtn.dataset.tab);
    return;
  }

  const logoutBtn = e.target.closest(".logout-btn");
  if (logoutBtn) {
    logout();
    return;
  }

  const switchAdminTabBtn = e.target.closest(".switch-admin-tab-btn");
  if (switchAdminTabBtn) {
    switchAdminTab(switchAdminTabBtn.dataset.tab);
    return;
  }

  const switchClientTabBtn = e.target.closest(".switch-client-tab-btn");
  if (switchClientTabBtn) {
    switchClientTab(switchClientTabBtn.dataset.tab);
    return;
  }

  const placeOrderBtn = e.target.closest(".place-order-btn");
  if (placeOrderBtn) {
    placeOrder();
    return;
  }

  const editBtn = e.target.closest(".edit-req-btn");
  if (editBtn) {
    editRequestName(editBtn.dataset.id);
    return;
  }

  const approveBtn = e.target.closest(".approve-req-btn");
  if (approveBtn) {
    approveRequest(approveBtn.dataset.id);
    return;
  }

  const rejectBtn = e.target.closest(".reject-req-btn");
  if (rejectBtn) {
    rejectRequest(rejectBtn.dataset.id);
    return;
  }

  const banBtn = e.target.closest(".ban-user-btn");
  if (banBtn) {
    removeUser(banBtn.dataset.id);
    return;
  }

  const cartBtn = e.target.closest(".add-to-cart-btn");
  if (cartBtn) {
    addToCart(Number(cartBtn.dataset.id));
    return;
  }

  const minusBtn = e.target.closest(".qty-minus-btn");
  if (minusBtn) {
    changeQty(Number(minusBtn.dataset.id), -1);
    return;
  }

  const plusBtn = e.target.closest(".qty-plus-btn");
  if (plusBtn) {
    changeQty(Number(plusBtn.dataset.id), 1);
    return;
  }

  const receivedBtn = e.target.closest(".mark-obj-btn");
  if (receivedBtn) {
    markOrderReceived(receivedBtn.dataset.id);
    return;
  }

});

  </script>
</body>
</html>
